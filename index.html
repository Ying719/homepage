/* ==========================================================================
   0 · 设计变量
   想换配色只改这里。蓝色系已经调好层次，不建议大改 --primary 与 --line 的明度关系。
   ========================================================================== */
:root{
  /* 底色层：背景是一张浅蓝星空图，这里只是图片没加载出来时的兜底色 */
  --bg:            #D9E7F8;
  --surface:       #FFFFFF;
  --surface-2:     #FAFCFF;

  /* 文字层：不用纯黑，用带蓝调的深海军蓝，观感更干净 */
  --ink:           #101E38;
  --ink-2:         #3D4C69;
  --ink-3:         #74829C;
  --ink-4:         #9DA9BE;

  /* 线条层：发丝级描边，层次感主要靠它 */
  --line:          #E3EAF5;
  --line-2:        #D1DCEF;

  /* 主色：靛蓝三档 + 两块浅底 */
  --primary:       #1F55C4;
  --primary-deep:  #17408F;
  --primary-light: #4C7DE8;
  --primary-soft:  #EBF1FE;
  --primary-line:  #C6D8FA;

  /* 点缀色：暖琥珀，全站只用极少量（当前状态点、待补充提示） */
  --amber:         #B07213;
  --amber-soft:    #FDF4E5;
  --amber-line:    #EEDAAB;

  /* 阴影：三层由轻到重，卡片默认用第一层 */
  --sh-1: 0 1px 2px rgba(16,30,56,.045), 0 6px 18px -12px rgba(16,30,56,.16);
  --sh-2: 0 2px 6px rgba(16,30,56,.055), 0 20px 44px -24px rgba(16,30,56,.26);
  --sh-3: 0 30px 64px -32px rgba(23,64,143,.42), 0 6px 18px -10px rgba(16,30,56,.16);

  /* 圆角 */
  --r-1: 9px;
  --r-2: 14px;
  --r-3: 24px;

  /* 字体 */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace;

  /* 缓动：指数型减速，比 ease 高级，且不会弹跳 */
  --ease: cubic-bezier(.16,1,.3,1);

  --container: 1080px;
  --nav-h: 62px;
}

body::after{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.46) 0%, rgba(255,255,255,.20) 38%, rgba(255,255,255,.34) 100%);
}

/* 内容层要压在背景之上 */
.page{ position:relative; z-index:1 }

a{ color:inherit; text-decoration:none }
img{ max-width:100%; display:block }
button{ font:inherit; cursor:pointer }

::selection{ background:var(--primary-soft); color:var(--primary-deep) }

:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:3px;
  border-radius:4px;
}

.wrap{
  width:100%;
  max-width:var(--container);
  margin:0 auto;
  padding:0 28px;
}

/* ==========================================================================
   1 · 顶部导航
   ========================================================================== */
.nav{
  position:sticky; top:0; z-index:50;
  height:var(--nav-h);
  background:rgba(250,252,255,.66);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
          backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid rgba(255,255,255,.7);
  box-shadow:0 1px 0 rgba(31,85,196,.06);
}
.nav-in{
  height:100%;
  max-width:var(--container);
  margin:0 auto;
  padding:0 28px;
  display:flex; align-items:center; justify-content:space-between; gap:24px;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-size:15px; font-weight:600; letter-spacing:-.01em;
  flex:none;
}
.brand-dot{
  width:22px; height:22px; border-radius:7px;
  background:linear-gradient(150deg,#C9DEFF,#94BAF8);
  display:grid; place-items:center;
  color:#1B3E86; font-family:var(--font-display); font-size:14px; line-height:1;
  box-shadow:0 3px 8px -3px rgba(120,170,240,.7);
}
.nav-links{
  display:flex; align-items:center; gap:4px;
  height:100%;
}
.nav-link{
  position:relative;
  height:100%;
  display:inline-flex; align-items:center;
  padding:0 13px;
  font-size:14px; color:var(--ink-2);
  transition:color .25s var(--ease);
  white-space:nowrap;
}
.nav-link:hover{ color:var(--ink) }
.nav-link::after{
  content:"";
  position:absolute; left:13px; right:13px; bottom:-1px; height:2px;
  background:var(--primary);
  border-radius:2px 2px 0 0;
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .38s var(--ease);
}
.nav-link.is-current{ color:var(--primary); font-weight:600 }
.nav-link.is-current::after{ transform:scaleX(1) }

.nav-edit{
  flex:none;
  font-size:12.5px; color:var(--ink-3);
  border:1px solid var(--line-2);
  background:var(--surface);
  border-radius:999px;
  padding:5px 13px;
  transition:.25s var(--ease);
  /* 这个按钮只在本地预览（file://）或网址带 #edit 时显示，
     部署到网上之后访客是看不到的 */
  display:none;
}
body.is-local .nav-edit, body.is-editing .nav-edit{ display:inline-flex }
.nav-edit:hover{ color:var(--primary); border-color:var(--primary-line); background:var(--primary-soft) }

/* ==========================================================================
   2 · 首屏
   ========================================================================== */
.hero{
  padding:clamp(52px,8vw,92px) 0 clamp(48px,7vw,84px);
}
.hero-in{
  display:grid;
  grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);
  gap:clamp(32px,5vw,72px);
  align-items:center;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3);
  margin:0 0 20px;
  display:flex; align-items:center; gap:10px;
}
.eyebrow::before{
  content:""; width:26px; height:1px; background:var(--line-2); flex:none;
}
.hero-name{
  font-size:clamp(38px,5.4vw,60px);
  line-height:1.12;
  font-weight:700;
  letter-spacing:-.03em;
  margin:0 0 22px;
}
.hero-name em{
  font-family:var(--font-display);
  font-style:normal;
  font-weight:400;
  letter-spacing:.01em;
  color:var(--primary);
  padding:0 2px;
}
.hero-headline{
  font-size:clamp(17px,1.7vw,20px);
  line-height:1.7;
  color:var(--ink);
  font-weight:500;
  letter-spacing:-.005em;
  margin:0 0 16px;
  max-width:30em;
}
.hero-headline strong{ font-weight:600; color:var(--primary-deep) }
.hero-tagline{
  font-size:15px; line-height:1.85; color:var(--ink-2);
  margin:0 0 26px; max-width:34em;
}
.pills{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-bottom:30px;
}
.pill{
  display:inline-flex; align-items:center; gap:7px;
  font-size:13px; color:var(--ink-2);
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(8px);
          backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:999px;
  padding:5px 13px;
  box-shadow:0 1px 2px rgba(31,64,130,.06);
}
.pill i{
  width:5px; height:5px; border-radius:50%;
  background:var(--primary-light); flex:none;
}
.pill.is-live i{
  background:var(--amber);
  box-shadow:0 0 0 3px var(--amber-soft);
}
.hero-actions{ display:flex; flex-wrap:wrap; gap:11px }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  font-size:14.5px; font-weight:500;
  padding:10px 20px;
  border-radius:10px;
  border:1px solid transparent;
  transition:.28s var(--ease);
}
.btn-primary{
  background:linear-gradient(155deg,var(--primary-light),var(--primary));
  color:#fff;
  box-shadow:0 10px 24px -12px rgba(31,85,196,.85), inset 0 1px 0 rgba(255,255,255,.24);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 32px -14px rgba(31,85,196,.95), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-ghost{
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(8px);
          backdrop-filter:blur(8px);
  border-color:rgba(255,255,255,.9);
  color:var(--ink-2);
}
.btn-ghost:hover{
  transform:translateY(-2px);
  color:var(--primary);
  border-color:var(--primary-line);
  background:var(--surface-2);
  box-shadow:var(--sh-1);
}

/* --- 首屏右侧：叠层图片（星空夜景 + 两层衬卡，形成「叠片」层次） --- */
.hero-mark{
  position:relative;
  width:100%;
  aspect-ratio:1;
  max-width:300px;
  justify-self:end;
  isolation:isolate;
}

  position:absolute; inset:0;
  border-radius:var(--r-3);
  border:1px solid rgba(255,255,255,.85);
}

/* ==========================================================================
   3 · 区块通用样式
   ========================================================================== */
.section{
  padding:clamp(48px,6.6vw,84px) 0;
  scroll-margin-top:calc(var(--nav-h) + 12px);
}
.section + .section{ border-top:1px solid var(--line) }

.sec-head{ margin-bottom:clamp(26px,3.4vw,40px) }
.sec-no{
  display:block;
  font-family:var(--font-mono);
  font-size:11.5px; letter-spacing:.16em;
  color:var(--primary);
  margin-bottom:12px;
}
.sec-title{
  font-size:clamp(23px,2.7vw,30px);
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.3;
  margin:0;
}
.sec-intro{
  margin:12px 0 0;
  font-size:15px; line-height:1.8; color:var(--ink-2);
  max-width:42em;
}

.prose p{ margin:0 0 15px; color:var(--ink-2); font-size:15.5px; line-height:1.9; max-width:44em }
.prose p:last-child{ margin-bottom:0 }
.prose strong{ color:var(--ink); font-weight:600 }
.prose code{
  font-family:var(--font-mono); font-size:.88em;
  background:var(--primary-soft); color:var(--primary-deep);
  padding:1px 6px; border-radius:5px;
}
.points{
  list-style:none; margin:20px 0 0; padding:0;
  display:grid; gap:11px;
  max-width:44em;
}
.points li{
  position:relative;
  padding-left:26px;
  font-size:15px; line-height:1.8; color:var(--ink-2);
}
.points li::before{
  content:"";
  position:absolute; left:2px; top:11px;
  width:7px; height:7px; border-radius:2px;
  background:var(--primary-soft);
  border:1.5px solid var(--primary);
}
.points li strong{ color:var(--ink); font-weight:600 }

/* --- 卡片 --- */
.cards{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.cards[data-cols="3"]{ grid-template-columns:repeat(3,minmax(0,1fr)) }
.card{
  position:relative;
  display:block;
  background:rgba(255,255,255,.80);
  -webkit-backdrop-filter:blur(12px) saturate(160%);
          backdrop-filter:blur(12px) saturate(160%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-2);
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(31,64,130,.05), 0 12px 28px -16px rgba(31,64,130,.22);
  transition:transform .38s var(--ease), box-shadow .38s var(--ease), border-color .38s var(--ease), background-color .38s var(--ease);
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute; left:0; top:0; bottom:0;
  width:2px;
  background:linear-gradient(180deg,var(--primary-light),var(--primary));
  transform:scaleY(0);
  transform-origin:top;
  transition:transform .42s var(--ease);
}
a.card:hover, .card:hover{
  transform:translateY(-3px);
  border-color:var(--primary-line);
  background:rgba(255,255,255,.94);
  box-shadow:var(--sh-2);
}
.card:hover::before{ transform:scaleY(1) }

.card-meta{
  font-family:var(--font-mono);
  font-size:11px; letter-spacing:.08em;
  color:var(--ink-4);
  margin-bottom:9px;
}
.card-title{
  font-size:16.5px; font-weight:600; letter-spacing:-.01em;
  line-height:1.5;
  margin:0 0 9px;
  color:var(--ink);
}
.card-desc{
  font-size:14.5px; line-height:1.82; color:var(--ink-2);
  margin:0;
}
.card-tagline{ margin-top:14px }

.chips{ display:flex; flex-wrap:wrap; gap:7px }
.chip{
  font-size:12.5px; line-height:1.6;
  color:var(--primary-deep);
  background:var(--primary-soft);
  border:1px solid var(--primary-line);
  border-radius:999px;
  padding:3px 11px;
  white-space:nowrap;
}
.chip-sm{ font-size:12px; padding:2px 9px }
.card .chips{ margin-top:15px }

/* 虚线占位卡：提醒"这里还能再加一条"，等你填上真内容它自然变成普通卡片 */
.card-slot{
  display:flex; align-items:center; gap:13px;
  min-height:104px;
  background:rgba(255,255,255,.42);
  -webkit-backdrop-filter:none;
          backdrop-filter:none;
  border:1px dashed var(--line-2);
  box-shadow:none;
  color:var(--ink-3);
  font-size:14px; line-height:1.7;
}
.card-slot::before{ display:none }
.card-slot:hover{
  transform:none; box-shadow:none;
  border-color:var(--primary-line);
  background:rgba(255,255,255,.72);
  color:var(--ink-2);
}
.slot-plus{

<div class="edit-fab" data-page-node-id="lhDJ66trcA89ZiYG2vhlGE"><button type="button" id="fabEdit" data-page-node-id="pcRqFKHllPgPy8docAXVw8">编辑内容</button></div>
<aside class="edit-drawer" id="editDrawer" aria-label="内容编辑面板" data-page-node-id="d2YVYwxeJa5HfZYQB6LOT0">
  <div class="edit-head" data-page-node-id="yGCnPDkCjBYPT6Ubk5EYt2">
    <div data-page-node-id="i74AdWqB3AojHChHbGDg43">
      <h3 data-page-node-id="OQ5nSlxUygUL2v8MlX2XAP">内容编辑面板</h3>
      <p data-page-node-id="yiNbgMRineaIBNiX9DsTt9">改左边的文字，页面会立刻更新。满意后点「复制全部」，粘回 index.html 保存。</p>
    </div>
    <button type="button" id="closeEdit" data-page-node-id="Uu9VPFKoSceoP2lTFhq5id">关闭</button>
  </div>
  <div class="edit-tools" data-page-node-id="ZbzQRNqI1jVxSdZFAHw5Yw">
    <button type="button" id="copyAll" data-page-node-id="VBJ6KPFM1KNeOidWG5oTBQ">复制全部</button>
    <button type="button" id="resetAll" data-page-node-id="zUI0rEzEYdOgwBTDeb3Cwt">还原</button>
    <span class="edit-status" id="editStatus" data-page-node-id="ceYnK7bcPya6oP3Xd5Bh8Y">已同步</span>
  </div>
  <textarea id="editArea" spellcheck="false"></textarea>
  <div class="edit-tip" data-page-node-id="cn4QriRg7I8YUuh4is0Q1C">
    这里改的只是「预览」，刷新后会恢复成文件里的内容。<br data-page-node-id="iVeFmtINAmdLkapMdt6VIo">
    想让改动长期生效：点 <code data-page-node-id="wzo9k9J3sQHS34TB6meDMg">复制全部</code> → 打开 <code data-page-node-id="9Fsysl2brL5gcaEegaHVXg">index.html</code> → 用复制的内容替换中间那段配置 → 保存。
  </div>
</aside>

<script>
/* ==========================================================================
   页面渲染逻辑
   ────────────────────────────────────────────────────────────────────────
   下面这段是「怎么把上面那份数据画成网页」。正常情况下你不需要改它。
   只有想新增一种全新的栏目形态时，才需要动 RENDER 里的东西。
   ========================================================================== */
(function () {
  'use strict';

  var RAW = document.getElementById('site-config').textContent;

  /* ---------- 小工具 ---------- */

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 支持极少量的行内写法： **加粗**  `代码`  TODO
  function rich(s) {
    return escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/TODO/g, '<span class="todo">待补充</span>');
  }

  function attr(s) { return escapeHtml(s); }

  function external(href) {
    return href && !/^mailto:|^tel:|^#/.test(href);
  }

  function linkAttrs(href) {
    return external(href) ? ' target="_blank" rel="noopener noreferrer"' : '';
  }

  /* ---------- 各栏目形态的渲染器 ---------- */

  var RENDER = {
    // 段落 + 要点列表
    text: function (s) {
      var html = '<div class="prose">';
      (s.body || []).forEach(function (p) { html += '<p>' + rich(p) + '</p>'; });
      html += '</div>';
      if (s.points && s.points.length) {
        html += '<ul class="points">';
        s.points.forEach(function (p) { html += '<li>' + rich(p) + '</li>'; });
        html += '</ul>';
      }
      return html;
    },

    // 卡片网格：适合「在做的事」「项目作品」
    cards: function (s) {
      var cols = s.columns === 3 ? 3 : 2;
      var html = '<div class="cards" data-cols="' + cols + '">';
      (s.items || []).forEach(function (c) {
        // 标题写 TODO 的卡片，渲染成一个虚线占位槽，提示"这里还能再加一条"
        if (c.title === 'TODO' && !c.href) {
          html += '<div class="card card-slot"><span class="slot-plus">+</span>' +
                  rich(c.slot || '这里还能再加一条，在配置区复制一个卡片块就行') + '</div>';
          return;
        }
        var tag = c.href ? 'a' : 'div';
        html += '<' + tag + ' class="card"' + (c.href ? ' href="' + attr(c.href) + '"' + linkAttrs(c.href) : '') + '>';
        if (c.meta) html += '<div class="card-meta">' + rich(c.meta) + '</div>';
        if (c.title) html += '<h3 class="card-title">' + rich(c.title) + '</h3>';
        if (c.desc) html += '<p class="card-desc">' + rich(c.desc) + '</p>';
        if (c.tags && c.tags.length) {
          html += '<div class="chips">';
          c.tags.forEach(function (t) { html += '<span class="chip chip-sm">' + rich(t) + '</span>'; });
          html += '</div>';
        }
        html += '</' + tag + '>';
      });
      html += '</div>';
      return html;
    },

    // 技能分组
    tags: function (s) {
      var html = '<div class="skill-groups">';
      (s.groups || []).forEach(function (g) {
        html += '<div class="skill-row">';
        html += '<div class="skill-key">' + rich(g.name) +
                (g.note ? '<small>' + rich(g.note) + '</small>' : '') + '</div>';
        html += '<div class="chips">';
        (g.items || []).forEach(function (t) { html += '<span class="chip">' + rich(t) + '</span>'; });
        html += '</div></div>';
      });
      html += '</div>';
      return html;
    },

    // 时间线
    timeline: function (s) {
      var html = '<ol class="tl">';
      (s.items || []).forEach(function (i) {
        html += '<li class="tl-item' + (i.active ? ' is-active' : '') + '">';
        html += '<span class="tl-time">' + rich(i.time) + '</span>';
        html += '<div class="tl-body">';
        html += '<h3 class="tl-title">' + rich(i.title) + '</h3>';
        if (i.desc) html += '<p class="tl-desc">' + rich(i.desc) + '</p>';
        html += '</div></li>';
      });
      html += '</ol>';
      return html;
    },

    // 联系方式
    contact: function (s) {
      var html = '<div class="contact-grid">';
      (s.items || []).forEach(function (i) {
        var isTodo = String(i.value).trim() === 'TODO';
        html += '<div class="contact' + (isTodo ? ' is-todo' : '') + '">';
        if (isTodo) {
          // 还没填的联系方式：只显示一个「待补充」标记，不做成可点的链接
          html += '<span class="contact-main">';
          html += '<span class="contact-k">' + rich(i.label) + '</span>';
          html += '<span class="contact-v">' + rich(i.value) + '</span>';
          html += '</span>';
        } else {
          html += '<a class="contact-main" href="' + attr(i.href || '#') + '"' + linkAttrs(i.href) + '>';
          html += '<span class="contact-k">' + rich(i.label) + '</span>';
          html += '<span class="contact-v">' + rich(i.value) + '</span>';
          html += '</a>';
        }
        if (i.copy) {
          html += '<button class="contact-c" type="button" data-copy="' + attr(i.copy) + '">复制</button>';
        }
        html += '</div>';
      });
      html += '</div>';
      return html;
    }
  };

  /* ---------- 渲染整页 ---------- */

  function render(SITE) {
    var m = SITE.meta || {};
    var sections = SITE.sections || [];

    document.title = m.pageTitle || ((m.name || '个人主页') + ' · 个人主页');
    var nameEl = document.getElementById('brandName');
    if (nameEl) nameEl.textContent = (m.name || '') + ' · 个人主页';
    var dotEl = document.getElementById('brandDot');
    if (dotEl) dotEl.textContent = m.monogram || '·';

    // 导航
    document.getElementById('navLinks').innerHTML = sections.map(function (s) {
      return '<a class="nav-link" href="#' + attr(s.id) + '">' + rich(s.nav || s.title) + '</a>';
    }).join('');

    // 首屏
    var hero = document.getElementById('hero');
    hero.className = 'hero reveal';
    hero.innerHTML =
      '<div class="hero-in">' +
        '<div class="hero-main">' +
          (m.eyebrow ? '<p class="eyebrow">' + rich(m.eyebrow) + '</p>' : '') +
          '<h1 class="hero-name">Hi，我是 <em>' + rich(m.name) + '</em></h1>' +
          (m.headline ? '<p class="hero-headline">' + rich(m.headline) + '</p>' : '') +
          (m.tagline ? '<p class="hero-tagline">' + rich(m.tagline) + '</p>' : '') +
          (m.pills && m.pills.length
            ? '<div class="pills">' + m.pills.map(function (p) {
                // 字符串就是普通胶囊；想给某颗加琥珀点，就写成 { text: "xxx", live: true }
                var o = typeof p === 'string' ? { text: p } : p;
                return '<span class="pill' + (o.live ? ' is-live' : '') + '"><i></i>' + rich(o.text) + '</span>';
              }).join('') + '</div>'
            : '') +
          (m.actions && m.actions.length
            ? '<div class="hero-actions">' + m.actions.map(function (a) {
                return '<a class="btn ' + (a.primary ? 'btn-primary' : 'btn-ghost') + '" href="' + attr(a.href) + '"' + linkAttrs(a.href) + '>' + rich(a.label) + '</a>';
              }).join('') + '</div>'
            : '') +
        '</div>' +
        '<div class="hero-mark">' +
          '<div class="mark-plate"></div>' +
          '<div class="mark-plate"></div>' +
          '<div class="mark-face"></div>' +
        '</div>' +
      '</div>';

    // 各栏目
    document.getElementById('sections').innerHTML = sections.map(function (s) {
      var fn = RENDER[s.type];
      var inner = fn ? fn(s) : '<p class="card-desc">未知的栏目类型：' + escapeHtml(s.type) + '</p>';
      return '<section class="section reveal" id="' + attr(s.id) + '">' +
               '<div class="sec-head">' +
                 (s.no ? '<span class="sec-no">' + rich(s.no) + '</span>' : '') +
                 '<h2 class="sec-title">' + rich(s.title) + '</h2>' +
                 (s.intro ? '<p class="sec-intro">' + rich(s.intro) + '</p>' : '') +
               '</div>' +
               '<div class="sec-body">' + inner + '</div>' +
             '</section>';
    }).join('');

    // 页脚
    document.getElementById('foot').innerHTML =
      (m.motto ? '<p class="motto">' + rich(m.motto) + '</p>' : '') +
      '<div class="foot-in">' +
        '<span>' + rich(m.footNote || '') + '</span>' +
        '<span class="mono">最近更新：<strong>' + rich(m.updated || '') + '</strong></span>' +
      '</div>';

    bindCopyButtons();
    observeReveal();
    observeNav();
  }

  /* ---------- 复制按钮 ---------- */

  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallback()); });
      } else {
        resolve(fallback());
      }
      function fallback() {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (e) { return false; }
      }
    });
  }

  function bindCopyButtons() {
    document.querySelectorAll('.contact-c').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        var raw = btn.getAttribute('data-copy') || '';
        var text = raw === 'TODO' ? '' : raw;
        if (!text) { btn.textContent = '待填写'; setTimeout(function () { btn.textContent = '复制'; }, 1400); return; }
        copyText(text).then(function (ok) {
          btn.textContent = ok ? '已复制' : '复制失败';
          btn.classList.toggle('is-done', ok);
          setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('is-done'); }, 1400);
        });
      });
    });
  }

  /* ---------- 入场动效 ---------- */

  var revealIO = null;
  function observeReveal() {
    var items = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      items.forEach(function (el) { el.classList.add('is-in'); });
      return;
    }
    if (revealIO) revealIO.disconnect();
    revealIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add('is-in');
          revealIO.unobserve(en.target);
        }
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
    items.forEach(function (el) { revealIO.observe(el); });
  }

  /* ---------- 导航高亮 ---------- */

  var navIO = null;
  function observeNav() {
    var links = Array.prototype.slice.call(document.querySelectorAll('.nav-link'));
    var secs = Array.prototype.slice.call(document.querySelectorAll('.section'));
    if (!secs.length || !('IntersectionObserver' in window)) return;

    function setCurrent(id) {
      links.forEach(function (a) {
        a.classList.toggle('is-current', a.getAttribute('href') === '#' + id);
      });
    }

    if (navIO) navIO.disconnect();
    var visible = {};
    navIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { visible[en.target.id] = en.isIntersecting ? en.intersectionRatio : 0; });
      var best = null, bestRatio = 0;
      Object.keys(visible).forEach(function (k) {
        if (visible[k] > bestRatio) { bestRatio = visible[k]; best = k; }
      });
      if (best) setCurrent(best);
      var bottom = window.scrollY + window.innerHeight;
      if (bottom >= document.body.scrollHeight - 4 && secs.length) setCurrent(secs[secs.length - 1].id);
    }, { rootMargin: '-25% 0px -55% 0px', threshold: [0, .25, .5, .75, 1] });
    secs.forEach(function (s) { navIO.observe(s); });
  }

  /* ---------- 编辑面板 ---------- */

  function setupEditor(renderFn) {
    var area = document.getElementById('editArea');
    var status = document.getElementById('editStatus');
    var drawer = document.getElementById('editDrawer');
    var pristine = RAW.replace(/^\s*\n/, '').replace(/\s*$/, '');
    var timer = null;

    area.value = pristine;

    function setStatus(msg, cls) {
      status.textContent = msg;
      status.className = 'edit-status' + (cls ? ' ' + cls : '');
    }

    function parse(text) {
      // 用 Function 求值一个对象字面量。外面套括号是因为 { } 在语句开头会被当成代码块。
      return (new Function('return (' + text + '\n)'))();
    }

    function apply(silent) {
      try {
        var obj = parse(area.value);
        renderFn(obj);
        setStatus('已同步', 'is-ok');
        return true;
      } catch (err) {
        setStatus('语法有误：' + err.message, 'is-bad');
        return false;
      }
    }

    area.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { apply(); }, 320);
    });

    // Tab 插入两个空格，而不是跳走
    area.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        var s = area.selectionStart, t = area.selectionEnd;
        area.value = area.value.slice(0, s) + '  ' + area.value.slice(t);
        area.selectionStart = area.selectionEnd = s + 2;
      }
    });

    document.getElementById('copyAll').addEventListener('click', function () {
      copyText(area.value).then(function (ok) {
        setStatus(ok ? '已复制到剪贴板' : '复制失败，请手动选中', ok ? 'is-ok' : 'is-bad');
      });
    });

    document.getElementById('resetAll').addEventListener('click', function () {
      area.value = pristine;
      apply();
      setStatus('已还原', 'is-ok');
    });

    function open() { document.body.classList.add('panel-open'); area.focus(); }
    function close() { document.body.classList.remove('panel-open'); }

    document.getElementById('openEdit').addEventListener('click', open);
    document.getElementById('fabEdit').addEventListener('click', open);
    document.getElementById('closeEdit').addEventListener('click', close);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });

    // 网址后面带 #edit 就自动进入编辑模式；本地打开（file://）常驻"编辑内容"按钮
    function checkHash() {
      if (location.protocol === 'file:') document.body.classList.add('is-local');
      if (location.hash === '#edit') {
        document.body.classList.add('is-editing');
        open();
      }
    }
    window.addEventListener('hashchange', checkHash);
    checkHash();
  }

  /* ---------- 启动 ---------- */

  function boot() {
    var SITE;
    try {
      SITE = (new Function('return (' + RAW + '\n)'))();
    } catch (err) {
      document.getElementById('hero').innerHTML =
        '<div class="err"><strong>内容配置区有语法错误，页面暂时无法渲染。</strong>' +
        '<p>最常见的原因是：少了逗号、少了引号、或者括号没配对。</p>' +
        '<pre>' + escapeHtml(err.message) + '</pre></div>';
      console.error('[个人主页] 配置解析失败：', err);
      return;
    }
    render(SITE);
    setupEditor(function (obj) { render(obj); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
